services:
  - type: web
    name: macro-data-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PAY_TO
        value: "0x5d4201f59a0Ac8bcdB6106752846a4993395FF31"
      - key: X402_NETWORK
        value: mainnet
      - key: CDP_API_KEY_ID
        fromService:
          type: web
          name: market-hours-api
          envVarKey: CDP_API_KEY_ID
      - key: CDP_API_KEY_SECRET
        fromService:
          type: web
          name: market-hours-api
          envVarKey: CDP_API_KEY_SECRET
